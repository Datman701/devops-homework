name: S17 DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------- 1. Unit tests (gate) ----------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session17-devsecops/01-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing

  # ---------- 2. SAST (gate) ----------
  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: session17-devsecops/01-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static analysis (bandit)
        run: |
          pip install bandit
          bandit -r app -f screen --exit-zero

  # ---------- 3. SCA (gate) ----------
  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: session17-devsecops/01-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  # ---------- 4. Secret scanning (gate) ----------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: session17-devsecops/01-app
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed secrets
        run: |
          echo "Checking for hardcoded credentials..."
          if grep -rInE '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' . ; then
            echo "::error::Potential secret committed to the repository"
            exit 1
          else
            echo "No secrets detected."
          fi

  # ---------- 5. Docker build ----------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan]
    defaults:
      run:
        working-directory: session17-devsecops/01-app
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: session17-devsecops/01-app
          push: false
          tags: s17-flask:ci
          load: true

  # ---------- 6. Container image scanning (gate) ----------
  image-scan:
    name: Image Scan - Trivy
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Build image for scanning
        run: docker build -t s17-flask:scan session17-devsecops/01-app

      - name: Scan image
        run: trivy image --exit-code 1 --severity CRITICAL s17-flask:scan

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
        continue-on-error: true

  # ---------- 7. Push image to GHCR ----------
  push:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    needs: image-scan
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase image path
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/s17-flask" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: session17-devsecops/01-app
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
