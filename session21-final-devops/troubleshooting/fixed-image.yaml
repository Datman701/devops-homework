apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-broken-image
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image
  template:
    metadata:
      labels:
        app: broken-image
    spec:
      containers:
        - name: backend
          image: taskboard-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://taskboard:taskboard@taskboard-postgres:5432/taskboard
