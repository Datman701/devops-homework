apiVersion: v1
kind: Secret
metadata:
  name: taskboard-postgres
  namespace: taskboard
type: Opaque
stringData:
  username: taskboard
  password: taskboard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskboard-postgres-data
  namespace: taskboard
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-postgres
  namespace: taskboard
  labels:
    app: taskboard-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: taskboard-postgres
  template:
    metadata:
      labels:
        app: taskboard-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: taskboard
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: taskboard-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskboard-postgres
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: taskboard-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-postgres
  namespace: taskboard
  labels:
    app: taskboard-postgres
spec:
  selector:
    app: taskboard-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
