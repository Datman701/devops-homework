apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
data:
  taskboard.json: |
    {
      "title": "TaskBoard — Application Overview",
      "uid": "taskboard-overview",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Scrape target",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "up{job=\"taskboard-backend\"}", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests since start",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "targets": [
            { "expr": "sum(http_requests_total)", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 latency",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "s" }
          },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "5xx error ratio",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "percentunit" }
          },
          "targets": [
            { "expr": "(sum(rate(http_requests_total{status=\"5xx\"}[5m])) or vector(0)) / clamp_min(sum(rate(http_requests_total[5m])), 1)", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests by endpoint (since start)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "targets": [
            { "expr": "sum(http_requests_total) by (handler)", "refId": "A" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency percentiles",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "refId": "B" }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Responses by status (since start)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "targets": [
            { "expr": "sum(http_requests_total) by (status)", "refId": "A" }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Requests by method (since start)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "targets": [
            { "expr": "sum(http_requests_total) by (method)", "refId": "A" }
          ]
        }
      ]
    }
