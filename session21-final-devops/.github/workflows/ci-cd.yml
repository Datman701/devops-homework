name: S21 Final Project — CI/CD and DevSecOps

on:
  push:
    branches: [main]
    paths:
      - "session21-final-devops/**"
      - ".github/workflows/s21-final.yml"
  pull_request:
    branches: [main]
    paths:
      - "session21-final-devops/**"
      - ".github/workflows/s21-final.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: s21-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PROJECT: session21-final-devops

jobs:
  # -------------------------------------------------------------------
  # 1. Tests — the first quality gate.
  # -------------------------------------------------------------------
  test:
    name: Unit tests and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.PROJECT }}/application/backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: ${{ env.PROJECT }}/application/backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: ${{ env.PROJECT }}/application/backend
        run: pytest -v --tb=short

      - name: Lint with ruff
        working-directory: ${{ env.PROJECT }}/application/backend
        run: |
          ruff check app tests
          ruff format --check app tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: ${{ env.PROJECT }}/application/frontend
        run: |
          npm ci
          npm run build

  # -------------------------------------------------------------------
  # 2. SAST — Bandit static analysis of the Python backend.
  # -------------------------------------------------------------------
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit==1.8.0
      - name: Scan backend
        working-directory: ${{ env.PROJECT }}/application/backend
        run: bandit -r app -ll -f screen

  # -------------------------------------------------------------------
  # 3. SCA — dependency vulnerability scanning (Python and Node).
  # -------------------------------------------------------------------
  sca:
    name: SCA (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Audit Python dependencies
        working-directory: ${{ env.PROJECT }}/application/backend
        run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit Node dependencies
        working-directory: ${{ env.PROJECT }}/application/frontend
        run: npm ci && npm audit --audit-level=high

  # -------------------------------------------------------------------
  # 4. Secret scanning — Gitleaks.
  # -------------------------------------------------------------------
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ env.PROJECT }}/security/.gitleaks.toml

  # -------------------------------------------------------------------
  # 5. Docker build → image scan → security gate → GHCR push.
  # -------------------------------------------------------------------
  images:
    name: Build, scan and publish images
    runs-on: ubuntu-latest
    needs: [test, sast, sca, secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Derive image names and tags
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT }}/application/backend
          file: ${{ env.PROJECT }}/docker/backend.Dockerfile
          push: false
          load: true
          tags: taskboard-backend:scan

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT }}/application/frontend
          file: ${{ env.PROJECT }}/docker/frontend.Dockerfile
          push: false
          load: true
          tags: taskboard-frontend:scan

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: taskboard-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: taskboard-frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish backend
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag taskboard-backend:scan "$REGISTRY/${{ steps.meta.outputs.owner }}/taskboard-backend:${{ steps.meta.outputs.sha }}"
          docker tag taskboard-backend:scan "$REGISTRY/${{ steps.meta.outputs.owner }}/taskboard-backend:${{ steps.meta.outputs.short }}"
          docker push "$REGISTRY/${{ steps.meta.outputs.owner }}/taskboard-backend:${{ steps.meta.outputs.sha }}"
          docker push "$REGISTRY/${{ steps.meta.outputs.owner }}/taskboard-backend:${{ steps.meta.outputs.short }}"

      - name: Publish frontend
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag taskboard-frontend:scan "$REGISTRY/${{ steps.meta.outputs.owner }}/taskboard-frontend:${{ steps.meta.outputs.sha }}"
          docker tag taskboard-frontend:scan "$REGISTRY/${{ steps.meta.outputs.owner }}/taskboard-frontend:${{ steps.meta.outputs.short }}"
          docker push "$REGISTRY/${{ steps.meta.outputs.owner }}/taskboard-frontend:${{ steps.meta.outputs.sha }}"
          docker push "$REGISTRY/${{ steps.meta.outputs.owner }}/taskboard-frontend:${{ steps.meta.outputs.short }}"

  # -------------------------------------------------------------------
  # 6. Security gate — only reached when every scan above passed.
  # -------------------------------------------------------------------
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - name: Confirm all gates passed
        run: |
          echo "Tests, SAST, SCA, secret scan and image scans all passed."
          echo "Image publication is allowed. ArgoCD reconciles the new commit."
