apiVersion: v1
kind: Pod
metadata:
  name: demo-describe
  namespace: troubleshooting-demos
  labels:
    app: demo-describe
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
