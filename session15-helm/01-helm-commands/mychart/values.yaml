replicaCount: 1
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.27"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
hpa:
  enabled: false
autoscaling:
  enabled: false
