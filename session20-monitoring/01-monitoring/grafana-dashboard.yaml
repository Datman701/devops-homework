apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  labels:
    grafana_dashboard: "1"
data:
  node-overview.json: |
    {
      "title": "Node Overview",
      "uid": "node-overview",
      "schemaVersion": 39,
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "CPU Usage (%)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "100-(avg(rate(node_cpu_seconds_total{mode=\"idle\"}[2m]))*100)", "refId": "A"}]
        },
        {
          "id": 2, "type": "timeseries", "title": "Memory Available (GiB)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "node_memory_MemAvailable_bytes/1024/1024/1024", "refId": "A"}]
        },
        {
          "id": 3, "type": "stat", "title": "Cores",
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 8},
          "targets": [{"expr": "count(node_cpu_seconds_total)", "refId": "A"}]
        },
        {
          "id": 4, "type": "stat", "title": "Uptime (hours)",
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 8},
          "targets": [{"expr": "(node_time_seconds-node_boot_time_seconds)/3600", "refId": "A"}]
        },
        {
          "id": 5, "type": "timeseries", "title": "Filesystem Used (%)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"expr": "100*(1-node_filesystem_avail_bytes{mountpoint=\"/\"}/node_filesystem_size_bytes{mountpoint=\"/\"})", "refId": "A"}]
        }
      ]
    }
